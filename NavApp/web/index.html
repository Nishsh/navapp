    /* ---------- WGS-84 -> GCJ-02 纠偏（国测局标准偏移算法） ---------- */
    const wgs84ToGcj02 = (function () {
      const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
      function outOfChina(lng, lat) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
      function tLat(x, y) {
        let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
        r += (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3;
        r += (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
        return r;
      }
      function tLng(x, y) {
        let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
        r += (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3;
        r += (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
        return r;
      }
      return function (lng, lat) {
        if (outOfChina(lng, lat)) return [lng, lat];
        let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
        const radLat = lat / 180 * PI;
        let magic = Math.sin(radLat); magic = 1 - EE * magic * magic;
        const sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
        dLng = (dLng * 180) / (A / sqrtMagic * Math.cos(radLat) * PI);
        return [lng + dLng, lat + dLat];
      };
    })();

    /* 稳定伪随机：同一栋楼每次刷新高度一致，不会跳变 */
    function hash01(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    /* ---------- 楼块配色：按高度分档，顶面亮、侧面暗，立体感来自光照+色差 ---------- */
    function topColorFor(h) {
      if (h >= 90) return '#d8e4ff';
      if (h >= 55) return '#bccdf9';
      if (h >= 30) return '#9fb4f2';
      return '#8aa4ea';
    }
    function sideTopFor(h) {
      if (h >= 90) return '#9db4f0';
      if (h >= 55) return '#849ce8';
      if (h >= 30) return '#6f87de';
      return '#5f76d1';
    }
    const SIDE_BOTTOM = '#2c3d63';

    /* ---------- 统一给每个 feature 写入 _h（米），样式函数只读这个字段 ---------- */
    function resolveHeight(props, seedLng, seedLat) {
      let h = parseFloat(props.height) || parseFloat(props['building:height']) || 0;
      if (!h) {
        const lv = parseFloat(props['building:levels']) || parseFloat(props.levels) || 0;
        if (lv > 0) h = lv * 3 + 2;                 // 每层约 3m，加 2m 女儿墙
      }
      if (!h) h = 10 + hash01(seedLng, seedLat) * 42;  // 无高度属性：稳定伪随机 10~52m
      return Math.round(Math.max(4, Math.min(h, 320)));
    }

    function prepareBuildings(geojson, needGcj) {
      const out = [];
      const feats = (geojson && geojson.features) || [];
      for (let i = 0; i < feats.length; i++) {
        const f = feats[i];
        if (!f || !f.geometry) continue;
        const g = f.geometry;
        if (g.type !== 'Polygon' && g.type !== 'MultiPolygon') continue;
        let polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
        /* 结构层级：Polygon -> [g.coordinates] = 环数组；MultiPolygon -> 多边形数组。
         * 统一成 polys[多边形序号][环序号][点序号] = [lng, lat]，
         * 因此"至少 4 个点（含闭合点）"要检查的是外环 polys[0][0]，不是 polys[0]。 */
        const outerRing = polys[0] && polys[0][0];
        if (!polys.length || !outerRing || outerRing.length < 4) continue;
        if (needGcj) {
          polys = polys.map(poly => poly.map(ring => ring.map(p => {
            const q = wgs84ToGcj02(p[0], p[1]); return [q[0], q[1]];
          })));
        }
        const seed = polys[0][0][0];   // 外环首点，用作稳定伪随机高度的种子
        const props = Object.assign({}, f.properties || {});
        props._h = resolveHeight(props, seed[0], seed[1]);
        /* 内部统一成 polys[多边形][环][点] 便于纠偏，输出时必须还原成各自的规范结构：
         * Polygon 的 coordinates 是「环数组」，MultiPolygon 才是「多边形数组」。
         * 少这一层还原，Polygon 会被写成 MultiPolygon 的形状，Loca 解析不到有效面，楼块整批不显示。 */
        const outCoords = (g.type === 'Polygon') ? polys[0] : polys;
        out.push({ type: 'Feature', properties: props, geometry: { type: g.type, coordinates: outCoords } });
        if (out.length >= BUILDING_CFG.maxFeatures) break;
      }
      return { type: 'FeatureCollection', features: out };
    }

    /* ---------- 示例楼块：以当前地图中心为原点程序化生成街区，离线也能看到 3D 效果 ---------- */
    function buildDemoBuildings(center) {
      const feats = [];
      const rnd = mulberry32(Math.round(center[0] * 1000) * 7919 + Math.round(center[1] * 1000));
      const mLat = 111320, mLng = 111320 * Math.cos(center[1] * Math.PI / 180);
      const BLOCK = 88, ROAD = 26, N = 7;              // 7×7 街区，楼块 88m，路宽 26m
      const span = N * (BLOCK + ROAD);
      for (let gx = 0; gx < N; gx++) {
        for (let gy = 0; gy < N; gy++) {
          const bx = -span / 2 + gx * (BLOCK + ROAD), by = -span / 2 + gy * (BLOCK + ROAD);
          const per = 1 + Math.floor(rnd() * 3);       // 每街区 1~3 栋
          const cellW = BLOCK / per;
          for (let k = 0; k < per; k++) {
            const w = cellW * (0.58 + rnd() * 0.3), d = BLOCK * (0.45 + rnd() * 0.42);
            const ox = bx + k * cellW + (cellW - w) / 2, oy = by + (BLOCK - d) / 2;
            const h = 12 + Math.pow(rnd(), 1.7) * 96;  // 多数中低层，少量高层
            feats.push({
              type: 'Feature',
              properties: { name: '示例楼块', _h: Math.round(h), _demo: true },
              geometry: {
                type: 'Polygon',
                coordinates: [[
                  [center[0] + ox / mLng, center[1] + oy / mLat],
                  [center[0] + (ox + w) / mLng, center[1] + oy / mLat],
                  [center[0] + (ox + w) / mLng, center[1] + (oy + d) / mLat],
                  [center[0] + ox / mLng, center[1] + (oy + d) / mLat],
                  [center[0] + ox / mLng, center[1] + oy / mLat]
                ]]
              }
            });
          }
        }
      }
      return { type: 'FeatureCollection', features: feats };
    }

    /* ---------- Overpass(OSM) -> GeoJSON ---------- */
    function overpassToGeoJSON(data) {
      const feats = [];
      const els = (data && data.elements) || [];
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        if (!el.geometry || el.geometry.length < 3) continue;
        const ring = el.geometry.map(p => [p.lon, p.lat]);
        const a = ring[0], b = ring[ring.length - 1];
        if (a[0] !== b[0] || a[1] !== b[1]) ring.push([a[0], a[1]]);   // GeoJSON 要求闭环
        feats.push({
          type: 'Feature',
          properties: Object.assign({}, el.tags || {}, { _osmId: el.id }),
          geometry: { type: 'Polygon', coordinates: [ring] }
        });
        if (feats.length >= BUILDING_CFG.maxFeatures) break;
      }
      return { type: 'FeatureCollection', features: feats };
    }

    async function fetchWithTimeout(url, options, ms) {
      const ctrl = ('AbortController' in window) ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
      try {
        return await fetch(url, ctrl ? Object.assign({}, options, { signal: ctrl.signal }) : options);
      } finally { if (timer) clearTimeout(timer); }
    }

    async function fetchOsmBuildings(bbox) {
      const q = '[out:json][timeout:12];(way["building"](' + bbox + ');relation["building"](' + bbox + '););out geom tags ' + BUILDING_CFG.maxFeatures + ';';
      const body = 'data=' + encodeURIComponent(q);
      for (let i = 0; i < BUILDING_CFG.overpass.length; i++) {
        const ep = BUILDING_CFG.overpass[i];
        try {
          const r = await fetchWithTimeout(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: body
          }, BUILDING_CFG.fetchTimeout);
          if (!r.ok) continue;
          const gj = overpassToGeoJSON(await r.json());
          if (gj.features.length > 0) return gj;
        } catch (e) { /* 换下一个端点 */ }
      }
      return null;
    }

    function currentBBox() {
      const b = map.getBounds();
      const sw = b.getSouthWest(), ne = b.getNorthEast();
      const dLat = (ne.getLat() - sw.getLat()) * 0.1, dLng = (ne.getLng() - sw.getLng()) * 0.1;
      // Overpass 顺序：south,west,north,east
      return [sw.getLat() - dLat, sw.getLng() - dLng, ne.getLat() + dLat, ne.getLng() + dLng]
        .map(v => v.toFixed(5)).join(',');
    }

    /* ---------- Loca 初始化 ---------- */
    function initBuildings() {
      if (!LocaOK) {
        Buildings.warnOnce = true;
        setBuildingStatus('Loca 库未加载成功，已退回底图自带楼块', true);
        console.warn('[楼块] Loca 未加载：检查 https://webapi.amap.com/loca?v=2.0.0&key=... 是否被拦截');
        return;
      }
      try {
        Buildings.loca = new Loca.Container({ map: map });
        // 光照：环境光决定整体亮度，平行光决定侧面明暗，两者缺一楼块会显得"平"
        Buildings.loca.addLight(new Loca.AmbientLight({ intensity: 0.55, color: '#ffffff' }));
        Buildings.loca.addLight(new Loca.DirectionalLight({
          intensity: 0.7, color: '#fff4dd', target: [0, 0, 0], position: [0.5, -1, 1]
        }));
        Buildings.layer = new Loca.PolygonLayer({
          loca: Buildings.loca,
          zIndex: 120,
          opacity: 1,
          visible: true,
          zooms: [13, 22],
          cullface: 'back',
          acceptLight: true,
          shininess: 65,
          hasSide: true,
          hasBottom: false,
          depth: true
        });
        Buildings.loca.animate.start();   // 不启动帧控制器，生长动画不会播放
        Buildings.ready = true;
        setBuildingStatus('Loca 就绪，等待视野放大到 ' + BUILDING_CFG.minZoom + ' 级');
      } catch (err) {
        Buildings.ready = false;
        console.error('[楼块] Loca 初始化失败', err);
        setBuildingStatus('Loca 初始化失败：' + err.message, true);
      }
    }

    function applyBuildingStyle() {
      Buildings.layer.setStyle({
        altitude: 0,
        height: function (index, feature) { return (feature && feature.properties && feature.properties._h) || 12; },
        topColor: function (index, feature) { return topColorFor((feature.properties || {})._h || 12); },
        sideTopColor: function (index, feature) { return sideTopFor((feature.properties || {})._h || 12); },
        sideBottomColor: SIDE_BOTTOM,
        bottomColor: SIDE_BOTTOM
      });
    }

    function setBuildingStatus(text, isErr) {
      if (DOM.buildingStatus) {
        DOM.buildingStatus.textContent = text;
        DOM.buildingStatus.classList.toggle('err', !!isErr);
      }
      if (DOM.buildingBadge) {
        DOM.buildingBadge.innerHTML = (Buildings.visible && Buildings.count > 0)
          ? ('楼块 <b>' + Buildings.count + '</b> · ' + escapeHtml(Buildings.sourceName))
          : '';
      }
    }

    function applyMapFeatures() {
      // Loca 棱柱与底图自带楼块同时开会互相遮挡（z-fighting），
      // 有 Loca 数据时关掉底图 building 要素，没有时再打开作为兜底。
      const locaOn = Buildings.ready && Buildings.visible && Buildings.count > 0;
      const base = (VIEW.mode3D && !locaOn) ? ['bg', 'road', 'building', 'point'] : ['bg', 'road', 'point'];
      map.setFeatures(base);
    }

    function setBuildingsVisible(on) {
      Buildings.visible = !!on;
      if (Buildings.ready && Buildings.layer) {
        try { (on ? Buildings.layer.show() : Buildings.layer.hide()); }
        catch (e) { Buildings.layer.setLoca(on ? Buildings.loca : null); }
      }
      applyMapFeatures();
      setBuildingStatus(Buildings.ready
        ? (on ? (Buildings.count > 0 ? ('已渲染 ' + Buildings.count + ' 栋 · ' + Buildings.sourceName) : 'Loca 就绪，等待视野放大到 ' + BUILDING_CFG.minZoom + ' 级') : '楼块已关闭')
        : 'Loca 未就绪，使用底图自带楼块', !Buildings.ready);
    }

    /* ---------- 主加载流程 ---------- */
    async function loadBuildings(force) {
      if (!Buildings.ready || Buildings.loading) return;
      const z = map.getZoom();
      if (z < BUILDING_CFG.minZoom) {
        setBuildingStatus('当前 ' + z.toFixed(1) + ' 级，放大到 ' + BUILDING_CFG.minZoom + ' 级以上自动加载楼块');
        return;
      }
      const bbox = currentBBox();
      const c = map.getCenter();
      const key = BUILDING_CFG.source + '|' + (BUILDING_CFG.source === 'geojson' ? BUILDING_CFG.geojsonUrl : bbox);
      if (!force && key === Buildings.cacheKey && Buildings.count > 0) return;

      Buildings.loading = true;
      DOM.reloadBuildingBtn && (DOM.reloadBuildingBtn.disabled = true);
      setBuildingStatus('正在加载楼块数据…');
      let gj = null, name = '', needGcj = false;

      try {
        if (BUILDING_CFG.source === 'osm') {
          gj = await fetchOsmBuildings(bbox);
          name = 'OSM 真实建筑'; needGcj = true;
          if (!gj) throw new Error('Overpass 三个端点均无响应或该区域无建筑数据');
        } else if (BUILDING_CFG.source === 'geojson') {
          if (!BUILDING_CFG.geojsonUrl) throw new Error('请先填写 GeoJSON 地址');
          const r = await fetchWithTimeout(BUILDING_CFG.geojsonUrl, {}, BUILDING_CFG.fetchTimeout);
          if (!r.ok) throw new Error('GeoJSON 请求失败 HTTP ' + r.status);
          gj = await r.json();
          name = '自定义 GeoJSON'; needGcj = !!BUILDING_CFG.geojsonIsWgs84;
        } else {
          gj = buildDemoBuildings([c.getLng(), c.getLat()]);
          name = '示例楼块'; needGcj = false;   // 示例数据由地图中心推算，本身已是 GCJ-02
        }
      } catch (err) {
        console.warn('[楼块] 主数据源失败，回落示例数据：', err);
        gj = buildDemoBuildings([c.getLng(), c.getLat()]);
        name = '示例楼块（回落）'; needGcj = false;
        setBuildingStatus('原始数据源不可用（' + err.message + '），已回落为示例楼块', true);
      }

      try {
        const prepared = prepareBuildings(gj, needGcj);
        if (prepared.features.length === 0) {
          Buildings.count = 0; Buildings.cacheKey = '';
          setBuildingStatus('该视野内没有可渲染的建筑面数据', true);
          return;
        }
        const src = new Loca.GeoJSONSource({ data: prepared });
        Buildings.layer.setSource(src);
        applyBuildingStyle();
        // 生长动画：height 从 0 长到真实值
        if (typeof Buildings.layer.clearAnimates === 'function') Buildings.layer.clearAnimates();
        Buildings.layer.addAnimate({
          key: 'height', value: [0, 1], duration: 900, transform: 260,
          random: true, easing: 'CubicInOut', yoyo: false, repeat: 0
        });
        Buildings.count = prepared.features.length;
        Buildings.cacheKey = key;
        Buildings.sourceName = name;
        Buildings.loadedCenter = [c.getLng(), c.getLat()];
        applyMapFeatures();
        setBuildingStatus('已渲染 ' + Buildings.count + ' 栋 · ' + name + (name.indexOf('示例') === 0 ? '（非真实建筑）' : ''));
      } catch (err) {
        console.error('[楼块] 渲染失败', err);
        setBuildingStatus('渲染失败：' + err.message, true);
      } finally {
        Buildings.loading = false;
        DOM.reloadBuildingBtn && (DOM.reloadBuildingBtn.disabled = false);
      }
    }

    function set3DMode(on, silent) {
      VIEW.mode3D = !!on;
      // 楼块现在由 Loca 图层负责，底图 building 要素仅作兜底（见 applyMapFeatures）
      setBuildingsVisible(VIEW.mode3D);
      if (!State.navMode) {
        const z = map.getZoom();
        const shouldTilt = VIEW.mode3D && z >= VIEW.BUILDING_MIN_ZOOM;
        map.setPitch(shouldTilt ? VIEW.BROWSE_PITCH : 0, false, 400);
        if (!shouldTilt) map.setRotation(0, false, 400);
      }
      if (VIEW.mode3D) loadBuildings(false);
      if (!silent) showToast(VIEW.mode3D ? '已开启 3D 楼块（Loca GeoJSON 渲染）' : '已切换 2D 平面视图');
      update3DBtn();
    }

    function update3DBtn() {
      if (!DOM.toggle3DBtn) return;
      DOM.toggle3DBtn.classList.toggle('active', VIEW.mode3D);
      DOM.toggle3DBtn.title = VIEW.mode3D ? '切换到 2D 平面视图' : '切换到 3D 楼块视图';
    }

    /* 缩放跨越楼块阈值时自动调整俯仰角：
     * 拉远（<16 级）自动压平，避免低层级下 3D 透视把图面拉得看不清；
     * 拉近（>=16 级）自动抬起，露出建筑立面。 */
    map.on('zoomend', () => {
      if (State.navMode || !VIEW.mode3D) return;
      const z = map.getZoom();
      map.setPitch(z >= VIEW.BUILDING_MIN_ZOOM ? VIEW.BROWSE_PITCH : 0, false, 300);
      loadBuildings(false);          // 跨阈值/换视野后按需补载楼块
    });

    /* 平移结束后节流重载楼块：视野换了，原来那批棱柱已经不在屏幕里。
     * 导航中不走这里（导航视角每帧 setCenter 会疯狂触发），
     * 改由 navRenderLoop 按"离开已加载中心 N 米"判断，见 reloadIfFar()。 */
    let buildingReloadTimer = null;
    map.on('moveend', () => {
      if (!VIEW.mode3D || !Buildings.visible || State.navMode) return;
      clearTimeout(buildingReloadTimer);
      buildingReloadTimer = setTimeout(() => loadBuildings(false), 800);
    });

    function reloadIfFar(lng, lat) {
      if (!Buildings.loadedCenter || !Buildings.visible) return false;
      const d = AMap.GeometryUtil.distance(Buildings.loadedCenter, [lng, lat]);
      return d > BUILDING_CFG.reloadDistance;
    }


    // 【修复】原代码 new 了一个 drivingBase 却从未使用（死代码），
    // 而每次规划又为 4 种策略各 new 一个 AMap.Driving，连点几次就撞上高德 Driving 服务 QPS 限流，
    // 限流后回调是静默失败，用户只看到「未能规划出路线」。改为按策略缓存实例，全程复用。
    const drivingCache = new Map();
    function getDriving(policy) {
      if (!drivingCache.has(policy)) {
        drivingCache.set(policy, new AMap.Driving({ policy, map: null, panel: null, hideMarkers: true }));
      }
      return drivingCache.get(policy);
    }

    let geocoder = null;
    const geocoderWaiters = [];
    AMap.plugin('AMap.Geocoder', () => {
      geocoder = new AMap.Geocoder({ city: '全国' });
      geocoderWaiters.splice(0).forEach(fn => fn(geocoder));
    });

    /* 【修复】geocoder 是异步插件，页面刚加载完的一瞬间用户就可能点「地图选点确认」或
     * 「使用当前位置」，此时 geocoder 仍为 null，直接调用会抛 TypeError 导致后续逻辑中断。
     * 统一走 withGeocoder：未就绪则排队，就绪后立即执行。 */
    function withGeocoder(fn) {
      if (geocoder) { fn(geocoder); return; }
      geocoderWaiters.push(fn);
    }

    // ==========================================
    // 3. 通用工具函数
    // ==========================================
    function showToast(msg, isError = false, isLoading = false) {
      DOM.locToast.innerHTML = (isLoading ? '<div class="spinner"></div>' : (isError ? '⚠️ ' : '✅ ')) + msg;
      DOM.locToast.classList.add('show');
      if (!isLoading) {
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => DOM.locToast.classList.remove('show'), 3000);
      }
    }

    /* 【附加修复】POI 名称、地址、导航指令都来自外部数据（其中 POI 名称属于用户可提交内容），
     * 原代码直接拼进 innerHTML，存在 HTML/脚本注入面。统一转义后再插入。 */
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function clearInputCoords(inputEl) {
      inputEl.dataset.lng = '';
      inputEl.dataset.lat = '';
      inputEl.dataset.useLocation = '';
    }

    function hasValidCoord(inputEl) {
      const lng = parseFloat(inputEl.dataset.lng);
      const lat = parseFloat(inputEl.dataset.lat);
      return (!isNaN(lng) && !isNaN(lat) && inputEl.dataset.useLocation === '1');
    }

    // 注：原 getSearchParam() 已移除 —— 它返回的 { keyword, city:'全国' } 交给 Driving.search
    // 解析成功率很低，现统一由 resolveEndpoint()/resolveKeyword() 先把地名转成坐标。

    // ==========================================
    // 4. 路线规划核心逻辑
    // ==========================================
    function searchRoutePromise(drivingInstance, start, end) {
      return new Promise((resolve) => {
        /* 【修复】补超时保护：Driving.search 在弱网/限流时可能长时间不回调，
         * 会让 planRoute 一直卡在 planning=true，「规划路线」按钮永久禁用。 */
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) { settled = true; resolve({ status: 'fail', error: 'timeout' }); }
        }, 12000);

        const callback = (status, result) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (status === 'complete' && result.routes?.length > 0) {
            resolve({ status: 'success', route: result.routes[0] });
          } else {
            resolve({ status: 'fail', error: result?.info || status });
          }
        };
        // start / end 现在恒为 [lng, lat] 坐标数组（由 resolveEndpoint 保证），
        // 不再需要区分关键字分支
        drivingInstance.search(start, end, callback);
      });
    }

    /* 【修复】原代码直接把 { keyword, city:'全国' } 丢给 Driving.search，
     * 「全国」范围的手输地名解析成功率很低，失败时面板只显示「未能规划出路线」，
     * 用户无法区分是「两地之间确实不通」还是「地名没解析出来」。
     * 这里先用 AutoComplete / Geocoder 把关键字确定性地转成坐标，再规划，
     * 并把「解析失败」和「规划失败」区分提示。 */
    function resolveKeyword(keyword) {
      return new Promise((resolve) => {
        autocomplete.search(keyword, (status, result) => {
          const tips = (status === 'complete' && result.tips) ? result.tips.filter(t => t.location) : [];
          if (tips.length > 0) { resolve([tips[0].location.lng, tips[0].location.lat]); return; }
          withGeocoder(g => {
            g.getLocation(keyword, (s2, r2) => {
              if (s2 === 'complete' && r2.geocodes?.length > 0) {
                const loc = r2.geocodes[0].location;
                resolve([loc.lng, loc.lat]);
              } else {
                resolve(null);
              }
            });
          });
          // geocoder 极端情况下未就绪也不至于永久挂起
          setTimeout(() => resolve(null), 8000);
        });
      });
    }

    async function resolveEndpoint(inputEl) {
      if (hasValidCoord(inputEl)) {
        return [parseFloat(inputEl.dataset.lng), parseFloat(inputEl.dataset.lat)];
      }
      return await resolveKeyword(inputEl.value.trim());
    }

    async function planRoute(showLoading = true) {
      const startVal = DOM.startInput.value.trim();
      const endVal = DOM.endInput.value.trim();
      if (!startVal || !endVal) return;

      /* 【修复】并发锁：routeBtn 原本没有任何防重复点击，连点几次会瞬时打出 4×N 个
       * Driving 请求，撞限流后静默失败。规划期间禁用按钮并直接忽略重复触发。 */
      if (State.planning) return;

      // 本次请求的序号，返回时若已过期则整批丢弃
      const seq = ++State.planSeq;
      State.planning = true;
      DOM.routeBtn.disabled = true;
      const done = () => {
        if (seq !== State.planSeq) return;
        State.planning = false;
        DOM.routeBtn.disabled = false;
        if (State.planPending) {   // 补跑被并发锁挡下的那次输入变更
          State.planPending = false;
          scheduleAutoPlan();
        }
      };

      State.overlays.forEach(o => map.remove(o)); State.overlays = [];
      State.markers.forEach(m => map.remove(m)); State.markers = [];
      State.routes = []; State.activeIdx = 0; DOM.routeTabs.innerHTML = '';

      if (showLoading) {
        DOM.routePanel.classList.remove('hidden');
        DOM.panel.innerHTML = '<div style="color:#6b7280;display:flex;align-items:center;gap:8px;padding:10px 0;"><div class="spinner" style="border-color:rgba(79,70,229,0.3);border-top-color:#4f46e5;"></div> 正在计算最优路线...</div>';
      }

      try {
        const [startParam, endParam] = await Promise.all([
          resolveEndpoint(DOM.startInput),
          resolveEndpoint(DOM.endInput)
        ]);

        // 过期结果（用户在等待期间又改了输入）直接丢弃，避免旧路线覆盖新路线
        if (seq !== State.planSeq) return;

        const unresolved = [];
        if (!startParam) unresolved.push(`起点「${startVal}」`);
        if (!endParam) unresolved.push(`终点「${endVal}」`);
        if (unresolved.length > 0) {
          if (showLoading) {
            DOM.routePanel.classList.remove('hidden');
            DOM.panel.innerHTML = `<div style="color:#dc2626;padding:8px 0;">无法识别${unresolved.join('、')}，请从下拉联想中选择具体地点。</div>`;
            showToast('地点解析失败', true);
          }
          return;
        }

        // 回写解析出的坐标，后续切换策略/重规划不必再解析一次
        DOM.startInput.dataset.lng = startParam[0]; DOM.startInput.dataset.lat = startParam[1];
        DOM.endInput.dataset.lng = endParam[0]; DOM.endInput.dataset.lat = endParam[1];
        DOM.startInput.dataset.useLocation = '1'; DOM.endInput.dataset.useLocation = '1';

        const promises = STRATEGIES.map(strategy =>
          searchRoutePromise(getDriving(strategy.policy), startParam, endParam).then(res => {
            if (res.status === 'success') {
              res.route._strategyName = strategy.label;
              return res.route;
            }
            return null;
          })
        );

        const results = await Promise.allSettled(promises);
        if (seq !== State.planSeq) return;   // 同样做过期校验

        const validRoutes = results.filter(r => r.status === 'fulfilled' && r.value).map(r => r.value);

        const uniqueRoutes = [];
        const seen = new Set();
        validRoutes.forEach(route => {
          const key = `${route.distance}_${route.time}`;
          if (!seen.has(key)) {
            seen.add(key);
            uniqueRoutes.push(route);
          }
        });

        uniqueRoutes.sort((a, b) => a.time - b.time);

        if (uniqueRoutes.length > 0) {
          State.routes = uniqueRoutes;
          DOM.routePanel.classList.remove('hidden');
          renderRoutes();
          if (showLoading) showToast(`成功获取 ${State.routes.length} 条路线方案`);
        } else if (showLoading) {
          /* 【修复】原来 showLoading=false（输入防抖触发的静默规划）失败时，
           * 也会把面板从隐藏状态强行弹出来显示红字报错，用户没点任何按钮就被打断。
           * 现在只有主动点击/回车规划才展示错误。 */
          DOM.routePanel.classList.remove('hidden');
          DOM.panel.innerHTML = '<div style="color:#dc2626;padding:8px 0;">未能规划出路线（可能触发服务限流或两地不可达），请稍后重试。</div>';
          showToast('规划失败', true);
        }
      } catch (err) {
        console.error('[planRoute]', err);
        if (showLoading && seq === State.planSeq) {
          DOM.panel.innerHTML = '<div style="color:#dc2626;padding:8px 0;">规划过程出错：' + err.message + '</div>';
          showToast('规划出错', true);
        }
      } finally {
        done();
      }
    }

    // ==========================================
    // 5. 路线渲染逻辑 (支持导航模式下的高亮重构)
    // ==========================================
    function renderRoutes(isNavMode = false) {
      State.overlays.forEach(o => map.remove(o)); State.overlays = [];

      // 在导航模式下，只渲染当前激活的路线，并且采用高亮加粗样式，防止备选路线干扰
      const routesToRender = (isNavMode ? [State.routes[State.activeIdx]] : State.routes)
        // 【修复】过滤掉 steps 缺失的脏数据，否则下面 step.path 的 flatMap 会直接抛错中断渲染
        .filter(r => r && Array.isArray(r.steps) && r.steps.length > 0);

      if (routesToRender.length === 0) {
        State.markers.forEach(m => map.remove(m)); State.markers = [];
        if (!isNavMode) renderTabs();
        return;
      }
      
      routesToRender.forEach((route, idx) => {
        // 导航模式下当前路线就是 active
        const isActive = isNavMode || (idx === State.activeIdx);
        const path = route.steps.flatMap(step => step.path);
        
        const polyline = new AMap.Polyline({
          path, 
          strokeColor: isActive ? (isNavMode ? COLORS.navActive : COLORS.active) : COLORS.inactive,
          strokeWeight: isActive ? (isNavMode ? 12 : 8) : 5, // 导航时线宽 12 更醒目
          strokeOpacity: isActive ? 1 : 0.55,
          lineJoin: 'round', lineCap: 'round', 
          zIndex: isActive ? (isNavMode ? 500 : 100) : 50, // 导航时 Z 轴置顶
          showDir: isActive, cursor: 'pointer'
        });
        
        if (!isActive) polyline.on('click', () => setActiveRoute(idx));
        map.add(polyline);
        State.overlays.push(polyline);
      });

      State.markers.forEach(m => map.remove(m)); State.markers = [];
      const activeRoute = State.routes[State.activeIdx];
      
      // 导航模式下隐藏起终点标，避免遮挡视野
      if (!isNavMode && activeRoute?.steps?.length > 0) {
        const startPos = activeRoute.steps[0].path[0];
        const endStep = activeRoute.steps[activeRoute.steps.length - 1];
        const endPos = endStep.path[endStep.path.length - 1];
        const mkStart = new AMap.Marker({ position: startPos, content: `<div style="width:20px;height:20px;border-radius:50%;background:#10b981;border:3px solid #fff;box-shadow:0 2px 8px rgba(16,185,129,0.5);"></div>`, offset: new AMap.Pixel(-10,-10), zIndex: 300 });
        const mkEnd = new AMap.Marker({ position: endPos, content: `<div style="width:20px;height:20px;border-radius:50%;background:#ef4444;border:3px solid #fff;box-shadow:0 2px 8px rgba(239,68,68,0.5);"></div>`, offset: new AMap.Pixel(-10,-10), zIndex: 300 });
        map.add([mkStart, mkEnd]);
        State.markers.push(mkStart, mkEnd);
      }

      if (!isNavMode) {
        renderTabs();
        renderDetails(activeRoute);
        map.setFitView([...State.overlays, ...State.markers]);
      }
    }

    function renderTabs() {
      DOM.routeTabs.innerHTML = State.routes.map((route, idx) => {
        const isActive = idx === State.activeIdx;
        const name = route._strategyName || (idx === 0 ? '推荐路线' : `备选 ${idx}`);
        const dist = (route.distance / 1000).toFixed(1);
        const mins = Math.round(route.time / 60);
        return `<div class="route-tab ${isActive ? 'active' : ''}" data-idx="${idx}">
            <div class="tab-main">${name}</div>
            <div class="tab-sub">${dist} km · ${mins} 分钟</div>
          </div>`;
      }).join('');

      DOM.routeTabs.querySelectorAll('.route-tab').forEach(tab => {
        tab.addEventListener('click', () => setActiveRoute(parseInt(tab.dataset.idx)));
      });
    }

    function renderDetails(route) {
      if (!route?.steps) { DOM.panel.innerHTML = ''; return; }
      DOM.panel.innerHTML = route.steps.map((step, i) => {
        const distText = step.distance ? (step.distance > 1000 ? (step.distance/1000).toFixed(1) + ' km' : step.distance + ' m') : '';
        return `<div class="route-step">
            <span class="index">${i + 1}</span>
            <div>
              <div class="desc">${escapeHtml(step.instruction || '')}</div>
              ${distText ? `<div class="dist">${distText}</div>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function setActiveRoute(idx) {
      if (idx === State.activeIdx || idx < 0 || idx >= State.routes.length) return;
      State.activeIdx = idx;
      renderRoutes();
    }

    // ==========================================
    // 6. 自动规划与输入监听
    // ==========================================
    function scheduleAutoPlan() {
      if (!DOM.startInput.value.trim() || !DOM.endInput.value.trim()) return;
      clearTimeout(State.autoPlanTimer);
      // 600ms 太短，手输地名时容易在联想面板还没点出来时就触发规划，
      // 既浪费配额又会让地图 setFitView 反复跳动。放宽到 900ms 并在规划中跳过。
      State.autoPlanTimer = setTimeout(() => {
        // 上一批规划还没回来时不要丢弃用户的新输入，标记待办，等它结束后自动补跑一次
        if (State.planning) { State.planPending = true; return; }
        planRoute(false);
      }, 900);
    }

    function bindInputEvents(inputEl) {
      inputEl.addEventListener('input', () => {
        clearInputCoords(inputEl);
        scheduleAutoPlan();
        handleInputSuggest(inputEl);
      });
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); planRoute(true); }
      });
      inputEl.addEventListener('focus', () => {
        if (State.isPicking) exitPickMode();
        if (inputEl.value.trim() && !hasValidCoord(inputEl)) {
          handleInputSuggest(inputEl);
        }
      });
    }

    bindInputEvents(DOM.startInput);
    bindInputEvents(DOM.endInput);

    DOM.routeBtn.addEventListener('click', () => planRoute(true));
    DOM.closePanelBtn.addEventListener('click', () => DOM.routePanel.classList.add('hidden'));

    DOM.swapBtn.addEventListener('click', () => {
      [DOM.startInput.value, DOM.endInput.value] = [DOM.endInput.value, DOM.startInput.value];
      [DOM.startInput.dataset.lng, DOM.endInput.dataset.lng] = [DOM.endInput.dataset.lng, DOM.startInput.dataset.lng];
      [DOM.startInput.dataset.lat, DOM.endInput.dataset.lat] = [DOM.endInput.dataset.lat, DOM.startInput.dataset.lat];
      [DOM.startInput.dataset.useLocation, DOM.endInput.dataset.useLocation] = [DOM.endInput.dataset.useLocation, DOM.startInput.dataset.useLocation];
      scheduleAutoPlan();
    });

    // ==========================================
    // 7. 智能搜索联想与实时测距
    // ==========================================
    const autocomplete = new AMap.AutoComplete({ city: '全国' });

    function handleInputSuggest(inputEl) {
      const keyword = inputEl.value.trim();
      if (!keyword) { removeSuggestionPanel(inputEl); return; }

      clearTimeout(inputEl._suggestTimer);
      inputEl._suggestTimer = setTimeout(() => {
        autocomplete.search(keyword, (status, result) => {
          if (status === 'complete' && result.tips) {
            renderSuggestionPanel(inputEl, result.tips.filter(t => t.location));
          } else {
            removeSuggestionPanel(inputEl);
          }
        });
      }, 300);
    }

    function renderSuggestionPanel(inputEl, tips) {
      removeSuggestionPanel(inputEl);
      if (tips.length === 0) return;

      const panel = document.createElement('div');
      panel.className = 'custom-suggestion-panel';
      
      panel.innerHTML = tips.map((tip, idx) => {
        let distHtml = '';
        if (State.currentPos) {
          const dist = AMap.GeometryUtil.distance([State.currentPos.lng, State.currentPos.lat], [tip.location.lng, tip.location.lat]);
          const text = dist > 1000 ? (dist / 1000).toFixed(1) + ' km' : Math.round(dist) + ' m';
          distHtml = `<span class="suggestion-distance">${text}</span>`;
        }
        return `<div class="custom-suggestion-item" data-idx="${idx}">
          <div style="flex: 1; min-width: 0;">
            <div class="suggestion-title">${escapeHtml(tip.name)}</div>
            <div class="suggestion-sub">${escapeHtml((tip.district || '') + (tip.address || ''))}</div>
          </div>
          ${distHtml}
        </div>`;
      }).join('');

      panel.addEventListener('mousedown', (e) => {
        const item = e.target.closest('.custom-suggestion-item');
        if (!item) return;
        e.preventDefault();
        
        const tip = tips[parseInt(item.dataset.idx)];
        inputEl.value = tip.name;
        inputEl.dataset.lng = tip.location.lng;
        inputEl.dataset.lat = tip.location.lat;
        inputEl.dataset.useLocation = '1';
        
        removeSuggestionPanel(inputEl);
        scheduleAutoPlan();
      });

      inputEl.parentElement.appendChild(panel);
    }

    function removeSuggestionPanel(inputEl) {
      const old = inputEl.parentElement.querySelector('.custom-suggestion-panel');
      if (old) old.remove();
    }

    [DOM.startInput, DOM.endInput].forEach(el => {
      el.addEventListener('blur', () => setTimeout(() => removeSuggestionPanel(el), 200));
    });


    // ==========================================
    // 8. 第一人称导航核心逻辑 (视角前移与路线高亮)
    // ==========================================
    let naviMarker = null;
    let naviMarkerEl = null;   // 【修复】缓存小车图标 DOM，避免每个 GPS 点都 setContent 重建节点
    let locMarker = null, locCircle = null;
    let currentHeading = 0;

    /* 【重做】自车标记：原来是一个 🚗 emoji，
     * 问题有三：① emoji 各平台字形不一致，很多机型上是一辆"侧面朝左"的车，
     *   旋转后根本看不出车头朝哪；② 圆形底盘没有前后之分；③ 旋转中心不在图形几何中心。
     * 现在换成高德 App 同款的「导航箭头」内联 SVG：
     *   · 尖头朝上、尾部带内凹缺口 —— 前后指向唯一确定，一眼可辨
     *   · 白色描边 + 白色底盘 + 投影 —— 在任何底图/楼块配色上都不会糊掉
     *   · 外圈呼吸光环表示定位活跃
     *   · 只有 rot 这一层做 transform 旋转，尖头在 SVG 内部恒定朝上，
     *     因此 rotate(0) == 指向屏幕正上方 == 车头向上，语义清晰不会算错。 */
    const NAVI_ICON_SIZE = 46;
    function buildNaviIcon() {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:' + NAVI_ICON_SIZE + 'px;height:' + NAVI_ICON_SIZE + 'px;';

      const halo = document.createElement('div');
      halo.style.cssText = 'position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-radius:50%;background:rgba(37,99,235,0.22);animation:pulse-ring 2s infinite;';

      const plate = document.createElement('div');
      plate.style.cssText = 'position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(15,23,42,0.38);';

      const rot = document.createElement('div');
      rot.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform;';
      rot.innerHTML =
        '<svg width="' + NAVI_ICON_SIZE + '" height="' + NAVI_ICON_SIZE + '" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">' +
          '<defs><linearGradient id="navArrowGrad" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>' +
          '</linearGradient></defs>' +
          // 尖头(23,5) → 右尾(38,38) → 内凹(23,31) → 左尾(8,38) → 闭合：前窄后宽 + 尾凹，指向无歧义
          '<path d="M23 5 L38 38 L23 31 L8 38 Z" fill="url(#navArrowGrad)" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>' +
        '</svg>';

      wrap.appendChild(halo); wrap.appendChild(plate); wrap.appendChild(rot);
      return { wrap: wrap, inner: rot };
    }

    function setNaviHeading(heading) {
      currentHeading = ((heading % 360) + 360) % 360;
      /* 【修复】原实现每收到一个定位点就 setContent 重建整棵 DOM（还顺带读了一次 getContent），
       * 高频点位下会明显闪烁并产生 GC 压力。改为只更新内层节点的 transform。
       * 角度经 carIconAngle() 换算：车头向上模式下要抵消地图自身的旋转。 */
      navLastIconAngle = -999;         // 强制下一次写入，避免被判为"角度没变"而跳过
      applyIconAngle(currentHeading);
    }

    /* 【新增】导航视角渲染循环
     * 用 rAF 而不是「每来一个 GPS 点转一次」：GPS 通常 1Hz，罗盘却能给到 30~60Hz，
     * 只有跟着罗盘高频插值，转头时地图才会像高德那样平滑跟随，而不是一格一格跳。 */
    let navRafId = null;
    let navLastCenter = null;
    let navLastAppliedHeading = -999;
    let navLastFrameTs = 0;
    let navLastReloadCheck = 0;

    function navRenderLoop(ts) {
      if (!State.navMode) { navRafId = null; navLastFrameTs = 0; return; }

      const now = ts || performance.now();
      const dt = navLastFrameTs ? Math.min(250, Math.max(1, now - navLastFrameTs)) : 16;
      navLastFrameTs = now;

      /* 【关键修复】原来罗盘读数只写进 Heading.compass，融合(lerp)只发生在 GPS 回调里，
       * 于是"站着转身 / 等红灯 / 信号不更新"时地图和箭头都不动，
       * 号称的"罗盘 30~60Hz 高频跟随"根本没生效。
       * 现在每帧都做一次融合（gpsHeading 传 null，内部会用最近一次 Heading.gps），
       * 罗盘才能真正驱动视角。dt 参与平滑，帧率高也不会转得过冲。 */
      updateHeading(null, Heading.speed, dt);

      // 箭头：无论用户是否在手动操作地图，都要指向真实航向（公式已含 map.getRotation()）
      applyIconAngle(Heading.value);

      const manual = Date.now() < State.navManualUntil;   // 用户手动操作期间不抢视角
      if (!manual && State.currentPos) {
        // 角度变化小于 0.3° 时不重设，避免每帧都触发底图重绘
        if (Math.abs(((Heading.value - navLastAppliedHeading + 540) % 360) - 180) > 0.3) {
          applyMapHeading(Heading.value);
          navLastAppliedHeading = Heading.value;
          applyIconAngle(Heading.value);   // 地图刚转完，箭头补偿角同步刷新
        }

        /* 中心点只在「真的动了」时才更新，且必须传 immediately=true：
         * setCenter 默认带动画，rAF 每帧发起一个动画会互相打断，画面表现为持续抖动。 */
        const ahead = getMapCenterAhead(State.currentPos.lng, State.currentPos.lat, Heading.value, 120);
        const moved = !navLastCenter
          || Math.abs(ahead[0] - navLastCenter[0]) > 1e-6
          || Math.abs(ahead[1] - navLastCenter[1]) > 1e-6;
        if (moved) { map.setCenter(ahead, true); navLastCenter = ahead; }
      }

      // 导航中每 5 秒检查一次是否已驶出楼块加载范围，是则补载（不依赖 moveend）
      if (State.currentPos && now - navLastReloadCheck > 5000) {
        navLastReloadCheck = now;
        if (VIEW.mode3D && reloadIfFar(State.currentPos.lng, State.currentPos.lat)) loadBuildings(true);
      }

      navRafId = requestAnimationFrame(navRenderLoop);
    }

    /* =====================================================================
     * 【新增】航向角模块：罗盘 + GPS 融合
     * ---------------------------------------------------------------------
     * 为什么必须加这个：
     * navigator.geolocation 返回的 coords.heading 只有在「设备移动中」才有值，
     * 静止时（也就是你刚点下"开始导航"那一刻）它是 null。原代码此时只能退化成
     * currentHeading = 0，于是地图永远先转到正北，而不是你当前面朝的方向。
     * 要拿到"人面朝哪"，只能用设备磁力计/陀螺仪（DeviceOrientation）。
     *
     * 融合策略（与高德 App 一致）：
     *   - 静止 / 低速(<1.5m/s)：用罗盘方位角（磁力计）
     *   - 移动中：用 GPS heading（更准，且不受金属车体磁干扰）
     *   - 两者切换时做圆滑插值，避免指针突跳
     * ===================================================================== */
    const Heading = {
      value: 0,          // 融合后的平滑航向（0=正北，顺时针）
      compass: null,     // 罗盘原始值
      gps: null,         // GPS 原始值
      speed: 0,          // 当前速度 m/s
      listening: false,
      gotAbsolute: false,// 是否已收到 deviceorientationabsolute（Android 真北基准）
      useCompass: true,  // 罗盘不可用时自动置 false
    };

    const DEG = Math.PI / 180;

    /* 可调校准偏移：若实测发现朝向整体固定偏了几度（磁偏角 / 设备传感器差异），
     * 改这一个数字即可，不用动下面的算法。广东地区磁偏角约 -3°，一般无需修正。 */
    const COMPASS_OFFSET = 0;

    /* 从 DeviceOrientationEvent 推算罗盘方位角（0=正北，顺时针）。
     *
     * 为什么不用 W3C 文档里那段 atan(Vx/Vy)：
     * 该式在「手机竖直握持」(beta≈90°，也就是车载支架/手持导航最常见的姿势) 时
     * Vy→0，atan(0/0) 直接得 NaN，罗盘会整个失效。
     *
     * 这里改用几何推导的稳定形式。设备到世界的旋转矩阵 R = Rz(α)·Rx(β)·Ry(γ)，
     * 世界系取 x=东, y=北, z=天：
     *   · 屏幕顶边(设备 Y 轴)在世界系 = (-sinα·cosβ, cosα·cosβ, sinβ)
     *     → 方位角 = atan2(-sinα, cosα) = -α，与 β、γ 无关，但 cosβ→0 时水平投影退化；
     *   · 屏幕法线(设备 Z 轴)在 β=90° 时 = (sin(α+γ), -cos(α+γ), 0)
     *     → 用户面朝方向（法线反向）= -(α+γ)。
     * 因此按 |β| 分段：接近水平用顶边投影，接近竖直用法线投影。 */
    function compassHeadingFromEvent(e) {
      // iOS Safari 直接给出系统级罗盘角（已含倾斜补偿，顺时针自磁北）
      if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
        return e.webkitCompassHeading + COMPASS_OFFSET;
      }
      if (e.alpha == null || isNaN(e.alpha)) return null;

      const alpha = e.alpha;
      const beta = e.beta || 0;
      const gamma = e.gamma || 0;
      let heading;

      if (Math.abs(beta) < 70) {
        heading = -alpha;                 // 顶边水平投影：与 β、γ 无关
      } else {
        heading = -(alpha + gamma);       // 竖直握持：改用屏幕法线的反方向
      }
      return heading + COMPASS_OFFSET;
    }

    function onDeviceOrientation(e) {
      /* Android Chrome 会同时派发 deviceorientationabsolute 与 deviceorientation：
       * 前者的 alpha 相对「真北」，后者的 alpha 只相对「设备开机时的朝向」，
       * 拿后者当罗盘会导致朝向随开机姿势乱偏。因此一旦收到过 absolute 事件，
       * 就永久忽略非 absolute 事件；iOS 没有 absolute 事件，走 webkitCompassHeading 分支。 */
      if (e.type === 'deviceorientationabsolute') {
        Heading.gotAbsolute = true;
      } else if (Heading.gotAbsolute) {
        return;
      }
      const h = compassHeadingFromEvent(e);
      if (h == null || isNaN(h)) return;
      Heading.compass = ((h % 360) + 360) % 360;   // 归一到 [0,360)
      Heading.useCompass = true;
    }

    /* iOS 13+ 必须在用户手势的同步调用栈里申请权限，异步回调里再调会被拒。
     * 所以要在"开始导航"按钮的 click 处理里第一时间调用。 */
    function requestCompassPermission() {
      return new Promise((resolve) => {
        try {
          const DOE = window.DeviceOrientationEvent;
          if (DOE && typeof DOE.requestPermission === 'function') {
            DOE.requestPermission().then(state => resolve(state === 'granted')).catch(() => resolve(false));
            return;
          }
        } catch (err) { /* 忽略，走监听降级 */ }
        resolve(true);
      });
    }

    function startCompass() {
      if (Heading.listening) return;
      Heading.listening = true;
      // Android/Chrome 需要 absolute 事件才是相对正北；iOS 走 deviceorientation
      window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
    }

    function stopCompass() {
      Heading.listening = false;
      window.removeEventListener('deviceorientationabsolute', onDeviceOrientation, true);
      window.removeEventListener('deviceorientation', onDeviceOrientation, true);
    }

    /* 圆滑插值：走最短弧，避免 359°→1° 时地图反向转一整圈 */
    function lerpAngle(from, to, t) {
      let diff = ((to - from + 540) % 360) - 180;
      return (from + diff * t + 360) % 360;
    }

    /* 融合并平滑：移动中优先 GPS（更准、不受车体磁干扰），静止/低速用罗盘。
     * dtMs：由 rAF 传入的帧间隔，用于做「与帧率无关」的指数平滑；
     *       不传时（GPS 回调直接调）退回固定系数 0.35。 */
    function updateHeading(gpsHeading, speed, dtMs) {
      if (typeof speed === 'number' && !isNaN(speed)) Heading.speed = speed;
      if (gpsHeading != null && !isNaN(gpsHeading)) Heading.gps = ((gpsHeading % 360) + 360) % 360;

      let target = null;
      const moving = Heading.speed > 1.5;   // ~5.4 km/h 以上认为在移动
      if (moving && Heading.gps != null) {
        target = Heading.gps;
      } else if (Heading.compass != null) {
        target = Heading.compass;
      } else if (Heading.gps != null) {
        target = Heading.gps;   // 罗盘不可用时退回 GPS
        Heading.useCompass = false;
      }
      if (target == null) return Heading.value;

      const t = (dtMs > 0) ? (1 - Math.exp(-dtMs / 160)) : 0.35;
      Heading.value = lerpAngle(Heading.value, (target + 360) % 360, t);
      return Heading.value;
    }

    /* 【核心修复】高德 JS API 2.0 官方文档定义：rotation = 地图「顺时针」旋转角度。
     * 要让前进方向朝屏幕正上方（车头向上），地图必须「逆时针」转 heading，
     * 即 setRotation(-heading)。原代码写的是 setRotation(heading)，方向正好相反，
     * 于是车头朝东时前进方向被转到屏幕下方 —— 就是你看到的"地图转到背面去"。 */
    function applyMapHeading(heading) {
      const h = ((heading % 360) + 360) % 360;   // 归一到 [0,360)
      map.setRotation((360 - h) % 360);          // 逆时针 h 度 == 顺时针 (360-h) 度
    }

    /* 【重写】箭头屏幕角度的计算方式。
     *
     * 高德 2.0 里自定义 DOM 内容的 Marker 是「屏幕对齐」的：地图 rotation 变化时
     * 标记本身不跟着转（和文字标注保持水平是同一套机制）。所以要让箭头指对方向，
     * 必须自己把地图的旋转量加回来：
     *
     *     屏幕角度 = 真实航向 + map.getRotation()
     *
     * 验证两种模式：
     *   · 导航中 applyMapHeading 设 rotation = 360 - heading
     *     → 屏幕角度 = heading + 360 - heading = 0（箭头恒定朝屏幕正上方，即车头向上）
     *   · 北向上浏览 rotation = 0
     *     → 屏幕角度 = heading（箭头指向真实方位）
     *   · 导航中用户手动转图（5 秒自由操作窗口内）
     *     → 公式自动跟着当前 rotation 走，箭头依然指向真实前进方向，不会错位
     *
     * 原来那个 MARKER_ROTATES_WITH_MAP 布尔开关是"猜一个方向、真机不对再改"，
     * 而且非导航/手动转图两种情况都会算错；换成上式后不再需要猜。
     * 若你在某个特殊版本上确认标记确实随地图旋转，把下面常量改成 false 即可退回旧口径。 */
    const MARKER_SCREEN_ALIGNED = true;
    function carIconAngle(heading) {
      const h = ((heading % 360) + 360) % 360;
      if (!MARKER_SCREEN_ALIGNED) return h;
      const r = (typeof map.getRotation === 'function' ? (map.getRotation() || 0) : 0);
      return ((h + r) % 360 + 360) % 360;
    }

    /* 每帧只在角度真的变化时才写 transform，避免无谓的重排 */
    let navLastIconAngle = -999;
    function applyIconAngle(heading) {
      if (!naviMarkerEl) return;
      const a = carIconAngle(heading);
      if (Math.abs(((a - navLastIconAngle + 540) % 360) - 180) < 0.2) return;
      naviMarkerEl.style.transform = 'rotate(' + a.toFixed(2) + 'deg)';
      navLastIconAngle = a;
    }


    /* 【修复 1】增加 onError 回调：原代码失败时只弹 toast，调用方无从知晓，
     *          导致 locateBtn 被置 disabled 后永远无法恢复（点一次失败就彻底卡死）。
     * 【修复 2】移除「转换失败就用原始 GPS 坐标」的兜底：
     *          中国境内 WGS-84 与高德 GCJ-02 相差 100~700 米，静默使用会让小车、
     *          起点标记明显偏离道路，用户以为是地图或算法错了。宁可报错也不返回偏移坐标。
     */
    function getPreciseLocation(onSuccess, onError) {
      const fail = (msg) => {
        showToast(msg, true);
        if (typeof onError === 'function') onError(msg);
      };
      if (!navigator.geolocation) { fail('当前浏览器不支持定位'); return; }
      if (!window.isSecureContext) {
        fail('定位需要 HTTPS 或 localhost 环境，请检查访问方式');
        return;
      }
      const geoOptions = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };

      navigator.geolocation.getCurrentPosition(
        (p) => {
          try {
            AMap.convertFrom([p.coords.longitude, p.coords.latitude], 'gps', (status, result) => {
              if (status === 'complete' && result.locations?.length > 0) {
                const amapLngLat = result.locations[0];
                onSuccess(amapLngLat.lng, amapLngLat.lat);
              } else {
                fail('坐标纠偏失败，请检查网络后重试');
              }
            });
          } catch (err) {
            fail('坐标纠偏异常：' + err.message);
          }
        },
        (e) => {
          const errorMsg = e.code === 1 ? '定位权限被拒绝，请在浏览器设置中允许获取位置'
                         : e.code === 2 ? '当前无法获取位置信号'
                         : e.code === 3 ? '定位超时，请到开阔处重试'
                         : '定位失败';
          fail(errorMsg);
        },
        geoOptions
      );
    }

    function updateLocationMarker(lng, lat, accuracy) {
      const pos = [lng, lat];
      State.currentPos = { lng, lat };
      
      if (!locMarker) {
        locMarker = new AMap.Marker({ map, position: pos, content: `<div style="position:relative;width:22px;height:22px;"><div style="position:absolute;inset:0;background:#4f46e5;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(79,70,229,0.5);"></div><div style="position:absolute;inset:0;border-radius:50%;background:rgba(79,70,229,0.3);animation:pulse-ring 2s infinite;"></div></div>`, offset: new AMap.Pixel(-11,-11), zIndex: 200 });
      } else {
        locMarker.setPosition(pos);
      }
      
      if (accuracy && accuracy < 500) {
        if (!locCircle) locCircle = new AMap.Circle({ map, strokeColor: '#4f46e5', strokeOpacity: .3, strokeWeight: 1, fillColor: '#4f46e5', fillOpacity: .08, zIndex: 150 });
        locCircle.setCenter(pos); locCircle.setRadius(accuracy);
      }
      
      if (!State.navMode) {
        // 【修复】原来每次定位回调都 setCenter + setZoom(16)，
        // 持续跟踪时会不断把用户手动缩放/平移的视图拽回去。改为只在首次定位时设定层级。
        map.setCenter(pos);
        if (!locMarker._zoomedOnce) { map.setZoom(16); locMarker._zoomedOnce = true; }
      }
    }

    // 计算车辆前方一定距离的坐标，用作视野中心点
    function getMapCenterAhead(lng, lat, heading, distance = 150) {
      if (heading === undefined || heading === null || isNaN(heading)) {
        heading = 0; // 默认正北
      }
      const rad = heading * Math.PI / 180;
      const R = 6378137;
      const dLat = (distance * Math.cos(rad)) / R * (180 / Math.PI);
      const dLng = (distance * Math.sin(rad)) / (R * Math.cos(lat * Math.PI / 180)) * (180 / Math.PI);
      return [lng + dLng, lat + dLat];
    }

    function startNavigation() {
      if (State.routes.length === 0) { showToast('请先规划路线', true); return; }
      if (State.navMode) return;   // 【修复】防止重复触发导致多个 watchPosition 叠加

      /* 【关键】iOS 13+ 的罗盘权限必须在用户手势的同步调用栈里申请，
       * 且只能申请一次 —— 下面 getPreciseLocation 回调里会递归再调一次 startNavigation，
       * 那已经在异步栈里，重复申请必被系统拒绝，还会误报"未获得指南针权限"。
       * 拿不到罗盘就是"点开始导航后地图不朝我面朝的方向"的直接原因。 */
      if (!State.compassAsked) {
        State.compassAsked = true;
        requestCompassPermission().then(granted => {
          if (!granted) {
            Heading.useCompass = false;
            showToast('未获得指南针权限，朝向将依赖 GPS（静止时可能不准）', true);
          }
        });
      }
      startCompass();
      // 给罗盘 400ms 出第一帧读数，随后立即把地图转到面朝方向，不必等 GPS
      setTimeout(() => {
        if (!State.navMode) return;
        if (Heading.compass != null) {
          Heading.value = Heading.compass;
          applyMapHeading(Heading.value);
        } else {
          Heading.useCompass = false;
          showToast('本机未提供指南针数据，朝向将依赖 GPS', true);
        }
      }, 400);

      if (!State.currentPos) {
        showToast('正在获取高精定位...', false, true);
        getPreciseLocation((lng, lat) => {
          updateLocationMarker(lng, lat, 50);
          startNavigation();
        }, () => {
          // 【修复】原代码没有失败回调，定位失败时 loading toast 会永久转圈不消失
          DOM.locToast.classList.remove('show');
        });
        return;
      }

      State.navMode = true;
      State.navErrCount = 0;
      State.navManualUntil = 0;
      navLastCenter = null;   // 重新计算中心点，避免沿用上次导航的旧值
      navLastAppliedHeading = -999;
      /* 【修复】原来这里硬写 currentHeading = 0，等于强制"正北朝上"，
       * 完全无视用户当前面朝方向。改为：有罗盘读数就用罗盘，没有才退回 0。 */
      Heading.value = (Heading.compass != null) ? Heading.compass : 0;
      currentHeading = Heading.value;
      showToast('第一人称导航启动');

      DOM.searchPanel.classList.add('dimmed');
      DOM.fabGroup.classList.add('dimmed');
      DOM.routePanel.classList.add('hidden');
      DOM.startNavBtn.style.display = 'none';
      DOM.stopNavBtn.style.display = 'flex';
      DOM.navFabGroup.style.display = 'flex';   // 显示"回到导航视角"按钮

      if (locMarker) locMarker.hide();
      if (locCircle) locCircle.hide();

      // 导航模式下重绘路线，去除干扰并加粗高亮
      renderRoutes(true);

      /* 【新增】导航视角升级为高德式 3D：
       * zoom 17.5 起楼块才会出现，pitch 60 才能看到建筑立面；
       * 立刻按当前面朝方向旋转，不再等第一个 GPS 点（原来要等 1 秒以上才转，观感就是"先转到背面"）。 */
      set3DMode(true, true);
      map.setZoomAndCenter(NAV_ZOOM, [State.currentPos.lng, State.currentPos.lat], false, 300);
      map.setPitch(NAV_PITCH, false, 300);
      applyMapHeading(Heading.value);

      if (!naviMarker) {
        const icon = buildNaviIcon();
        naviMarkerEl = icon.inner;
        naviMarker = new AMap.Marker({
          map: map,
          position: [State.currentPos.lng, State.currentPos.lat],
          content: icon.wrap,
          offset: new AMap.Pixel(-NAVI_ICON_SIZE / 2, -NAVI_ICON_SIZE / 2),
          zIndex: 500
        });
      } else {
        naviMarker.setPosition([State.currentPos.lng, State.currentPos.lat]);
        naviMarker.show();
      }
      setNaviHeading(Heading.value);

      if (navRafId === null) navRafId = requestAnimationFrame(navRenderLoop);

      if (State.watchId !== null) navigator.geolocation.clearWatch(State.watchId);

      State.watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { longitude, latitude, heading, speed } = position.coords;
          State.navErrCount = 0;   // 收到有效点位就清零容错计数

          /* 【核心修复】把 GPS heading 与罗盘融合后写入 Heading.value，
           * 由 navRenderLoop 高频平滑地驱动地图旋转；
           * 这里不再直接 map.setRotation(heading)（那正是"转到背面"的根因）。 */
          updateHeading(heading, speed);

          AMap.convertFrom([longitude, latitude], 'gps', (status, result) => {
            if (status !== 'complete' || !result.locations?.length) return;
            const amapPos = result.locations[0];
            State.currentPos = { lng: amapPos.lng, lat: amapPos.lat };
            if (naviMarker) naviMarker.setPosition([amapPos.lng, amapPos.lat]);
          });
        },
        (error) => {
          /* 【修复】原实现 error 一响就立刻 stopNavigation()。但 timeout:15000 在隧道、
           * 高架下、室内停车场等场景极易触发 code=3 的瞬时超时，导航会莫名其妙退出，
           * 用户正在开车时体验极差。改为：超时/信号弱允许连续容忍 3 次，
           * 权限被拒(code=1)或不可用(code=2)才立即退出。 */
          if (error.code === 3 && State.navErrCount < 3) {
            State.navErrCount++;
            showToast(`定位信号弱，正在重试(${State.navErrCount}/3)...`, false, true);
            return;
          }
          const msg = error.code === 1 ? '定位权限被收回，导航已退出'
                    : error.code === 2 ? '定位信号丢失，导航已退出'
                    : '导航定位超时，已退出';
          showToast(msg, true);
          stopNavigation();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 }
      );
    }

    function stopNavigation() {
      if (!State.navMode) return;
      State.navMode = false;
      State.navErrCount = 0;
      currentHeading = 0;                 // 【修复】复位航向，避免下次进场沿用旧角度
      Heading.value = 0;

      // 【新增】释放罗盘监听与渲染循环，否则后台会持续吃传感器与 CPU
      stopCompass();
      if (navRafId !== null) { cancelAnimationFrame(navRafId); navRafId = null; }

      if (naviMarkerEl) naviMarkerEl.style.transform = 'rotate(0deg)';

      DOM.searchPanel.classList.remove('dimmed');
      DOM.fabGroup.classList.remove('dimmed');
      DOM.startNavBtn.style.display = 'flex';
      DOM.stopNavBtn.style.display = 'none';
      DOM.navFabGroup.style.display = 'none';

      if (naviMarker) naviMarker.hide();
      if (locMarker) locMarker.show();
      if (locCircle) locCircle.show();

      if (State.watchId !== null) {
        navigator.geolocation.clearWatch(State.watchId);
        State.watchId = null;
      }

      // 退出导航视角：压平俯仰、回正旋转，再按当前 3D 档位重设
      map.setRotation(0, false, 400);
      set3DMode(VIEW.mode3D, true);
      map.setPitch(VIEW.mode3D && map.getZoom() >= VIEW.BUILDING_MIN_ZOOM ? VIEW.BROWSE_PITCH : 0, false, 400);

      /* 【修复】原代码无论有没有路线都强行 remove('hidden') 把底部面板弹出来，
       * 空状态下会显示一个只有标题的空壳面板。有路线才恢复展示。 */
      if (State.routes.length > 0) {
        DOM.routePanel.classList.remove('hidden');
        renderRoutes(false);   // 恢复普通渲染（含备选路线与起终点标记）
      }

      showToast('已退出导航模式');
    }

    DOM.startNavBtn.addEventListener('click', startNavigation);
    DOM.stopNavBtn.addEventListener('click', stopNavigation);

    /* =====================================================================
     * 【新增】3D 视图与导航视角控制
     * ===================================================================== */
    // 3D 楼块 / 2D 平面 切换
    DOM.toggle3DBtn.addEventListener('click', () => set3DMode(!VIEW.mode3D));

    // 一键回到车头向上视角（用户手动拖图后使用）
    DOM.navRecenterBtn.addEventListener('click', () => {
      State.navManualUntil = 0;
      if (State.currentPos) {
        applyMapHeading(Heading.value);
        map.setZoomAndCenter(NAV_ZOOM, [State.currentPos.lng, State.currentPos.lat], false, 300);
        map.setPitch(NAV_PITCH, false, 300);
      }
    });

    /* 导航中用户手动拖动/缩放地图时，暂停 5 秒自动跟随，
     * 否则每一次 setCenter/setRotation 都会跟用户的手指"抢方向盘"，地图会抖得没法看。
     * 5 秒后自动恢复车头向上（与高德 App 的行为一致）。 */
    ['dragstart', 'zoomstart', 'touchstart'].forEach(evt => {
      map.on(evt, () => {
        if (State.navMode) State.navManualUntil = Date.now() + 5000;
      });
    });

    // 初始化 Loca 楼块图层，再按当前档位应用一次 3D 设置（默认开启楼块）
    initBuildings();
    set3DMode(true, true);

    /* ---------- 楼块数据源设置卡 ---------- */
    function syncBuildingForm() {
      const isGeo = BUILDING_CFG.source === 'geojson';
      DOM.geojsonUrlInput.disabled = !isGeo;
      DOM.geojsonWgs84Chk.disabled = !isGeo;
      DOM.geojsonUrlInput.value = BUILDING_CFG.geojsonUrl;
      DOM.geojsonWgs84Chk.checked = BUILDING_CFG.geojsonIsWgs84;
      document.querySelectorAll('input[name="bSrc"]').forEach(r => { r.checked = (r.value === BUILDING_CFG.source); });
    }

    DOM.buildingSetBtn.addEventListener('click', () => {
      if (State.isPicking) exitPickMode();
      syncBuildingForm();
      DOM.buildingCard.classList.toggle('show');
    });
    DOM.closeBuildingCardBtn.addEventListener('click', () => DOM.buildingCard.classList.remove('show'));

    document.querySelectorAll('input[name="bSrc"]').forEach(radio => {
      radio.addEventListener('change', () => {
        BUILDING_CFG.source = radio.value;
        syncBuildingForm();
      });
    });

    DOM.reloadBuildingBtn.addEventListener('click', () => {
      BUILDING_CFG.geojsonUrl = DOM.geojsonUrlInput.value.trim();
      BUILDING_CFG.geojsonIsWgs84 = DOM.geojsonWgs84Chk.checked;
      Buildings.cacheKey = '';                     // 强制重新抓取，不吃缓存
      if (!VIEW.mode3D) set3DMode(true, true);     // 关着的话顺手打开
      loadBuildings(true);
      showToast('已按新数据源重载楼块');
    });


    // ==========================================
    // 9. 其他基础控制
    // ==========================================
    /* 【修复】删掉了原来的 `new AMap.Geolocation(...)`：它被创建后从未被调用过
     * （实际定位走的是浏览器原生 navigator.geolocation），属于死代码，
     * 还白白加载并初始化了一个插件。 */

    /* 【修复】「停止定位」按钮原本永远不显示（全文没有任何地方把它从 display:none 改回来），
     * 是一段死代码。现在把它接上真实功能：
     * 点「显示我的位置」= 定位一次 + 开启持续跟随；此时显示停止按钮；
     * 点「停止定位」= 结束跟随，回到静态蓝点。 */
    DOM.locateBtn.addEventListener('click', () => {
      if (State.trackWatchId !== null) {   // 已在跟随中，只把视野拉回当前位置
        if (State.currentPos) map.setCenter([State.currentPos.lng, State.currentPos.lat]);
        return;
      }

      DOM.locateBtn.disabled = true;
      showToast('正在获取位置...', false, true);
      getPreciseLocation((lng, lat) => {
        updateLocationMarker(lng, lat, 50);
        DOM.locateBtn.disabled = false;
        startTracking();
        showToast('已定位到当前位置，正在持续跟随');
      }, () => {
        // 【修复】原代码只在成功回调里恢复 disabled，定位失败一次按钮就永久卡死
        DOM.locateBtn.disabled = false;
      });
    });

    function startTracking() {
      if (State.trackWatchId !== null || !navigator.geolocation) return;
      if (!window.isSecureContext) { showToast('持续跟随需要 HTTPS 环境', true); return; }

      State.trackWatchId = navigator.geolocation.watchPosition(
        (p) => {
          try {
            AMap.convertFrom([p.coords.longitude, p.coords.latitude], 'gps', (status, result) => {
              if (status !== 'complete' || !result.locations?.length) return;
              const loc = result.locations[0];
              updateLocationMarker(loc.lng, loc.lat, p.coords.accuracy);
            });
          } catch (err) { console.error('[tracking]', err); }
        },
        (err) => {
          // 瞬时超时不打断跟随，只有权限问题才停止
          if (err.code !== 3) {
            showToast('持续定位中断：' + (err.code === 1 ? '权限被拒绝' : '信号不可用'), true);
            stopTracking(true);
          }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 2000 }
      );

      DOM.locateBtn.style.display = 'none';
      DOM.stopLocateBtn.style.display = 'flex';
      DOM.stopLocateBtn.classList.add('pulse');
    }

    function stopTracking(silent) {
      if (State.trackWatchId !== null) {
        navigator.geolocation.clearWatch(State.trackWatchId);
        State.trackWatchId = null;
      }
      DOM.locateBtn.disabled = false;
      DOM.locateBtn.style.display = 'flex';
      DOM.stopLocateBtn.style.display = 'none';
      DOM.stopLocateBtn.classList.remove('pulse');
      if (!silent) showToast('已停止定位');
    }

    DOM.stopLocateBtn.addEventListener('click', () => stopTracking(false));

    DOM.startLocBtn.addEventListener('click', () => {
      if (State.currentPos) { fillStartPos(State.currentPos.lng, State.currentPos.lat); return; }
      showToast('正在获取位置...', false, true);
      getPreciseLocation((lng, lat) => fillStartPos(lng, lat),
                         () => DOM.locToast.classList.remove('show'));
    });

    function fillStartPos(lng, lat) {
      DOM.startInput.value = `当前位置 (${lng.toFixed(6)}, ${lat.toFixed(6)})`;
      DOM.startInput.dataset.lng = lng; DOM.startInput.dataset.lat = lat;
      DOM.startInput.dataset.useLocation = '1';
      showToast('已填入当前位置');
      // 【修复】geocoder 未就绪时直接调用会抛 TypeError，改为排队等待插件加载完成
      withGeocoder(g => {
        g.getAddress([lng, lat], (status, res) => {
          if (status === 'complete' && res.regeocode) {
            DOM.startInput.value = res.regeocode.formattedAddress || DOM.startInput.value;
          }
          scheduleAutoPlan();
        });
      });
    }

    DOM.resetViewBtn.addEventListener('click', () => {
      if (State.navMode) return;
      if (State.overlays.length > 0) map.setFitView([...State.overlays, ...State.markers]);
      else map.setZoomAndCenter(12, [113.264, 23.129]);
      // 全览属于"看整体"，回正旋转并按当前 3D 档位重设俯仰角
      map.setRotation(0, false, 400);
      map.setPitch(VIEW.mode3D && map.getZoom() >= VIEW.BUILDING_MIN_ZOOM ? VIEW.BROWSE_PITCH : 0, false, 400);
    });

    // ==========================================
    // 10. 地图拖拽选点模式
    // ==========================================
    let revGeoTimer = null;

    function enterPickMode(target) {
      State.isPicking = true;
      State.pickTarget = target;
      State.pickAddress = '';
      DOM.pickTag.textContent = target === 'start' ? '起点' : '终点';
      DOM.pickAddress.innerHTML = '<div class="loading-dot"></div> 拖动地图选择位置...';

      DOM.searchPanel.classList.add('dimmed');
      DOM.fabGroup.classList.add('dimmed');
      DOM.crosshair.classList.add('show');
      DOM.pickCard.classList.add('show');
      DOM.routePanel.classList.add('hidden');

      const inputEl = target === 'start' ? DOM.startInput : DOM.endInput;
      const lng = parseFloat(inputEl.dataset.lng);
      const lat = parseFloat(inputEl.dataset.lat);
      if (!isNaN(lng) && !isNaN(lat)) map.setZoomAndCenter(16, [lng, lat]);
      else map.setZoom(16);

      map.on('moveend', reverseGeocodeHandler);
      map.on('zoomend', reverseGeocodeHandler);
      setTimeout(() => { if (State.isPicking) reverseGeocodeHandler(); }, 350);
    }

    function exitPickMode() {
      State.isPicking = false;
      State.pickTarget = null;
      DOM.searchPanel.classList.remove('dimmed');
      DOM.fabGroup.classList.remove('dimmed');
      DOM.crosshair.classList.remove('show');
      DOM.pickCard.classList.remove('show');
      clearTimeout(revGeoTimer);
      map.off('moveend', reverseGeocodeHandler);
      map.off('zoomend', reverseGeocodeHandler);
      // 【修复】enterPickMode 会把路线面板隐藏，但退出选点时从不恢复，
      // 已规划好的路线详情会一直消失，只能重新点规划才回来。
      if (State.routes.length > 0) DOM.routePanel.classList.remove('hidden');
    }

    function reverseGeocodeHandler() {
      if (!State.isPicking) return;
      clearTimeout(revGeoTimer);
      revGeoTimer = setTimeout(() => {
        const center = map.getCenter();
        const lng = center.getLng(), lat = center.getLat();
        DOM.pickAddress.innerHTML = '<div class="loading-dot"></div> 正在获取地址...';
        
        // 【修复】geocoder 可能尚未加载完成（页面刚打开就进选点模式），
        // 原代码直接调用会抛 TypeError，导致地址栏永远停在「正在获取地址...」。
        withGeocoder(g => {
          try {
            g.getAddress([lng, lat], (status, res) => {
              if (!State.isPicking) return;
              State.pickAddress = (status === 'complete' && res.regeocode?.formattedAddress) ? res.regeocode.formattedAddress : '';
              DOM.pickAddress.textContent = State.pickAddress || `${lng.toFixed(6)}, ${lat.toFixed(6)}`;
            });
          } catch (err) {
            if (!State.isPicking) return;
            State.pickAddress = '';
            DOM.pickAddress.textContent = `${lng.toFixed(6)}, ${lat.toFixed(6)}`;
          }
        });
      }, 300);
    }

    /* 【附加修复】页面卸载/刷新时释放 watchPosition 监听，
     * 否则部分浏览器会保留定位会话，持续耗电并占用 GPS。 */
    window.addEventListener('pagehide', () => {
      [State.watchId, State.trackWatchId].forEach(id => {
        if (id !== null && navigator.geolocation) navigator.geolocation.clearWatch(id);
      });
    });

    DOM.startPickBtn.addEventListener('click', () => { if (State.pickTarget === 'start') exitPickMode(); else { exitPickMode(); enterPickMode('start'); } });
    DOM.endPickBtn.addEventListener('click', () => { if (State.pickTarget === 'end') exitPickMode(); else { exitPickMode(); enterPickMode('end'); } });
    DOM.cancelPickBtn.addEventListener('click', () => exitPickMode());

    DOM.confirmPickBtn.addEventListener('click', () => {
      if (!State.isPicking) return;
      const center = map.getCenter();
      const lng = center.getLng(), lat = center.getLat();
      const inputEl = State.pickTarget === 'start' ? DOM.startInput : DOM.endInput;

      inputEl.value = State.pickAddress || `${lng.toFixed(6)}, ${lat.toFixed(6)}`;
      inputEl.dataset.lng = lng; inputEl.dataset.lat = lat;
      inputEl.dataset.useLocation = '1';

      exitPickMode();
      showToast(`已选择：${escapeHtml(inputEl.value)}`);
      scheduleAutoPlan();
    });

  </script>
</body>
</html>
